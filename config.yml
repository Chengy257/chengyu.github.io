#########################################################################
# File Name: config.yml
# Author: ChengYu (Cy257)
# Description: Hugo + Hextra 博客配置
# Site: https://chengy257.github.io/
#########################################################################

baseURL: "https://chengy257.github.io/chengyu.github.io/"
title: "Cy257's Blog"
languageCode: "zh-cn"
defaultContentLanguage: "zh"
theme: "hextra"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
enableEmoji: true
enableGitInfo: true

pagination:
  pagerSize: 10

outputs:
  home:
    - HTML
    - RSS

minify:
  disableXML: true
  minifyOutput: true

# ---------- Markdown 渲染 ----------
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    style: "monokai"
    lineNos: true
    codeFences: true
    guessSyntax: true
    tabWidth: 4

# ---------- 菜单 ----------
menu:
  main:
    - name: "博客"
      pageRef: /blog
      weight: 1
    - name: "关于"
      pageRef: /about
      weight: 2
    - name: "标签"
      pageRef: /tags
      weight: 3
    - name: "分类"
      pageRef: /categories
      weight: 4
    - name: "搜索"
      weight: 5
      params:
        type: search
    - name: GitHub
      weight: 6
      url: "https://github.com/Chengy257"
      params:
        icon: github

  sidebar:
    - name: "更多"
      params:
        type: separator
      weight: 1
    - name: "关于"
      pageRef: "/about"
      weight: 2
    - name: "标签"
      pageRef: "/tags"
      weight: 3

# ---------- 参数 ----------
params:
  description: "生物信息学 | NGS数据分析 | Python/R 脚本 | 学习笔记"

  navbar:
    displayTitle: true
    displayLogo: false

  footer:
    displayCopyright: true
    displayPoweredBy: true
    copyright: "© 2024 Cy257"

  theme:
    default: system
    displayToggle: true

  page:
    displayPagination: true
    width: normal

  blog:
    list:
      displayTags: true
    article:
      displayPagination: true

  toc:
    displayTags: true

  displayUpdatedDate: true
  dateFormat: "2006-01-02"

  editURL:
    enable: false

  search:
    flexsearch:
      js: "js/flexsearch.bundle.debug.js"

  imageZoom:
    enable: false

  favicon: "/img/favicon.ico"

  # 社交链接（Hextra footer area）
  social:
    github: "Chengy257"

# ---------- 分类法 ----------
taxonomies:
  category: categories
  tag: tags
  series: series

# ---------- 隐私 ----------
privacy:
  vimeo:
    disabled: false
    simple: true
  youtube:
    disabled: false
    privacyEnhanced: true
