#########################################################################
# File Name: config.yml
# Author: ChengYu (Cy257)
# Description: Hugo + Hextra 博客配置
# Site: https://chengy257.github.io/
#########################################################################

baseURL: "https://chengy257.github.io/chengyu.github.io/"
timeZone: "Asia/Shanghai"
title: "Cy257's Blog"
locale: "zh-CN"
defaultContentLanguage: "zh"
theme: "hextra"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
enableEmoji: true
enableGitInfo: true

pagination:
  pagerSize: 10

outputs:
  home:
    - HTML
    - RSS

minify:
  disableXML: true
  minifyOutput: true

# ---------- Markdown 渲染 ----------
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false
    style: "monokai"
    lineNos: true
    codeFences: true
    guessSyntax: true
    tabWidth: 4

# ---------- 菜单 ----------
menu:
  main:
    - name: "首页"
      pageRef: /
      weight: 1
    - name: "博客"
      pageRef: /blog
      weight: 2
    - name: "分类"
      pageRef: /categories
      weight: 3
    - name: "标签"
      pageRef: /tags
      weight: 4
    - name: "个人简历"
      pageRef: /about
      weight: 5
    - name: "搜索"
      weight: 6
      params:
        type: search
    - name: "切换主题"
      weight: 7
      params:
        type: theme-toggle

  sidebar:
    - name: "更多"
      params:
        type: separator
      weight: 1
    - name: "个人简历"
      pageRef: "/about"
      weight: 2
    - name: "标签"
      pageRef: "/tags"
      weight: 3

# ---------- 参数 ----------
params:
  description: "生物信息学 | NGS数据分析 | Python/R 脚本 | 学习笔记"
  images:
    - images/og-image.png

  navbar:
    displayTitle: true
    displayLogo: true

  footer:
    displayCopyright: true
    displayPoweredBy: true
    copyright: "© 2024 Cy257"

  theme:
    default: system
    displayToggle: true

  page:
    width: normal

  blog:
    article:
      displayPagination: true

  toc:
    displayTags: true

  displayUpdatedDate: true
  dateFormat: "2006-01-02"

  editURL:
    enable: false

  search:
    flexsearch:
      js: "js/flexsearch.bundle.min.js"

  imageZoom:
    enable: false

  # 评论（giscus，基于 GitHub Discussions；2026-09-03 已启用）
  # 剩余一步：浏览器里把 giscus App 安装到本仓库（https://github.com/apps/giscus → Configure → 仅选本仓库），
  # 否则评论区可加载但访客无法发表。更换分类/仓库时在 giscus.app 重新生成 repoId/categoryId。
  comments:
    enable: true
    type: giscus
    giscus:
      repo: "Chengy257/chengyu.github.io"
      repoId: "R_kgDOL8t1Lw"
      category: "Announcements"
      categoryId: "DIC_kwDOL8t1L84DEvpB"
      mapping: "pathname"

# ---------- 分类法 ----------
taxonomies:
  category: categories
  tag: tags
  series: series

# ---------- 相关文章（文章页底部，按 tags/categories 共现） ----------
related:
  includeNewer: true
  toLower: true
  threshold: 50
  indices:
    - name: tags
      weight: 80
    - name: categories
      weight: 40

# ---------- 隐私 ----------
privacy:
  vimeo:
    disabled: false
    simple: true
  youtube:
    disabled: false
    privacyEnhanced: true
