# 渲染入口：
#   - 首页:  layouts/hextra-home.html 调 partial custom/publications.html (variant=home)
#   - 简历:  content/about.md 内 {{< publications >}} → layouts/_shortcodes/publications.html (variant=cv)
# 字段说明：
#   authors — 作者行，允许 HTML 标记（<u>/<strong>/<sup>），输出时经 safeHTML；
#             <sup>#</sup> = 共同一作，<sup>*</sup> = 通讯作者
#   title / url — 标题与原文链接
#   journal / meta — 期刊与 "年; 卷(期), 页码" 信息（meta 不带尾随句点）
#   doi — 可选，DOI 链接
#   cover — 可选，true 表示封面文章（简历页追加 (Cover Article) 标注）
# 顺序约定：按年份倒序分组；同组内按重要性排列；编号由模板自动生成（连续）。
footnote: "(# co-first author, * corresponding author)"

